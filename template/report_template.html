<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page {
    size: letter;
    margin: 22mm 20mm 24mm 20mm;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 11.5pt;
    line-height: 1.62;
    color: #1c1c1e;
    background: #ffffff;
  }
  .masthead {
    border-bottom: 3px solid #1c1c1e;
    padding-bottom: 10pt;
    margin-bottom: 6pt;
  }
  .masthead .kicker {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 8.5pt;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #8e6a1f;
    margin: 0 0 6pt 0;
  }
  h1 {
    font-size: 26pt;
    line-height: 1.15;
    margin: 0 0 4pt 0;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  h2 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15pt;
    font-weight: 700;
    margin: 22pt 0 6pt 0;
    padding-top: 10pt;
    border-top: 1px solid #d8d3c8;
    letter-spacing: -0.2px;
    page-break-after: avoid;
  }
  h3 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 12pt;
    font-weight: 600;
    margin: 14pt 0 4pt 0;
    page-break-after: avoid;
  }
  p { margin: 0 0 9pt 0; }
  strong { color: #7a2518; }
  ul, ol { margin: 0 0 9pt 0; padding-left: 20pt; }
  li { margin-bottom: 4pt; }
  a { color: #234e70; word-break: break-all; }
  .reading-time {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 9pt;
    color: #6e6e73;
    margin: 0 0 18pt 0;
  }
  ol li { font-size: 10pt; line-height: 1.5; }
</style>
</head>
<body>
<div class="masthead">
  <p class="kicker">Personal Briefing &middot; Prepared for David</p>
</div>
{{CONTENT}}
</body>
</html>
